# 固定评审团（示例）
#
# 用途：用 --personas-file 指定时，跳过 S1 的现场生成，直接用这份名单。
#       适合"我每次都想要同一批人"的场景。
#
# 状态：设计样例，尚未被任何代码读取。
# 对应设计：docs/personas.md · docs/configuration.md §4
#
# 注意：d5 → 唱反调者是**必须**的（docs/personas.md §5）。
#      用这份文件时，若缺 adversary，代码仍会自动补位并告警。

version: 1
name: "软件设计通用评审团"
description: "适用于多数中小型工具类项目的通用评审团，5 人。"

personas:
  - id: p1
    name: 陈砚
    title: 离线推理工程师
    role_type: specialist
    stance: "能本地跑就绝不联网"
    bias: "倾向于低估模型的体积与内存代价"
    blind_spot: "忽略非技术用户的操作成本"
    cares_about: ["模型体积", "首字延迟", "内存峰值"]
    dimensions: ["offline-feasibility"]

  - id: p2
    name: 林知远
    title: 音频/算法工程师
    role_type: specialist
    stance: "质量优先，宁可慢十倍"
    bias: "对量化与压缩带来的质量损失过度敏感"
    blind_spot: "不关心用户的等待容忍度"
    cares_about: ["准确率", "WER", "边界场景表现"]
    dimensions: ["data-model"]

  - id: p3
    name: 苏晚
    title: 交互设计师
    role_type: generalist
    stance: "工具必须双击就能用，不能有说明书"
    bias: "倾向 GUI，轻视命令行用户的专业度"
    blind_spot: "低估命令行用户的专业度与偏好"
    cares_about: ["操作步数", "首次上手时间", "误操作恢复"]
    dimensions: ["ux-form-factor"]

  - id: p4
    name: 郑铎
    title: 成本与运维官
    role_type: specialist
    stance: "只关心三年后的维护账单和依赖腐烂速度"
    bias: "把一次性成本看得过重，轻视开发期速度的价值"
    blind_spot: "忽略早期产品需要快速试错这一事实"
    cares_about: ["依赖数量", "月度成本", "升级摩擦"]
    dimensions: ["cost-curve", "maintainability"]

  - id: p5
    name: 白弈
    title: 唱反调者
    role_type: adversary
    stance: "默认所有方案都不可靠，直到被证明为止"
    bias: "倾向于把最坏情况当作常态"
    blind_spot: null      # 反方故意不设盲点：他不需要被攻击的入口
    cares_about: ["失败场景覆盖率", "被忽略的用户群体", "未验证的假设"]
    dimensions: ["failure-modes", "scalability"]
